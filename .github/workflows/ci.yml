name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: lint + pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

  manifests:
    name: kustomize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Render prd-apps overlay
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq kubectl
          kubectl kustomize deploy/overlays/prd-apps >/dev/null

  push-to-gitlab:
    name: Push to GitLab
    uses: DataKnifeAI/github-workflows/.github/workflows/reusable-gitlab-mirror-push.yml@main
    needs:
      - test
      - manifests
    if: >-
      always() && needs.test.result == 'success' &&
      needs.manifests.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    secrets: inherit
    with:
      gitlab_mirror_path: dk-raas/dkai/agents/slashbay
