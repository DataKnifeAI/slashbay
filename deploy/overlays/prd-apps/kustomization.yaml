# Self-contained overlay for Fleet - no ../../base (path is slashbay/overlays/prd-apps)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: slashbay

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

commonLabels:
  managed-by: gitops
  cluster: prd-apps
