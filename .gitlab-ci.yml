# Mirror target: dk-raas/dkai/agents/slashbay
# GitHub is source of truth; this file builds/pushes Harbor after the mirror lands.
# Harbor login is provided by the kubernetes GitLab runners (same as high-command-*).
# Group/project CI variables: HARBOR_REGISTRY, HARBOR_PROJECT (defaults below).

stages:
  - test
  - docker
  - release

variables:
  IMAGE_NAME: slashbay
  HARBOR_REGISTRY: harbor.dataknife.net
  HARBOR_PROJECT: library

test:
  stage: test
  image: harbor.dataknife.net/dockerhub/library/python:3.12-slim
  script:
    - pip install -e ".[dev]"
    - ruff check src tests
    - pytest -q
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  tags:
    - kubernetes

publish:
  stage: docker
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  script:
    - |
      if [ -z "$HARBOR_REGISTRY" ] || [ -z "$HARBOR_PROJECT" ]; then
        echo "HARBOR_REGISTRY or HARBOR_PROJECT not set"
        echo "HARBOR_REGISTRY: ${HARBOR_REGISTRY:-NOT SET}"
        echo "HARBOR_PROJECT: ${HARBOR_PROJECT:-NOT SET}"
        exit 1
      fi

      IMAGE_TAG="${CI_COMMIT_SHORT_SHA:-$CI_PIPELINE_ID}"
      echo "Building $HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME"
      echo "Tags: latest, $IMAGE_TAG${CI_COMMIT_TAG:+, $CI_COMMIT_TAG}"

      OUTPUT_FLAGS="--output type=image,name=$HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:latest,push=true"
      OUTPUT_FLAGS="$OUTPUT_FLAGS --output type=image,name=$HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:$IMAGE_TAG,push=true"

      if [ -n "$CI_COMMIT_TAG" ]; then
        OUTPUT_FLAGS="$OUTPUT_FLAGS --output type=image,name=$HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:$CI_COMMIT_TAG,push=true"
      fi

      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        $OUTPUT_FLAGS
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  tags:
    - kubernetes

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      echo "Creating release for commit $CI_COMMIT_SHORT_SHA"
  release:
    tag_name: 'v0.$CI_PIPELINE_IID'
    description: 'Release v0.$CI_PIPELINE_IID'
    ref: '$CI_COMMIT_SHA'
  tags:
    - kubernetes
